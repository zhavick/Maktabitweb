name: MaktabIT Web CMS — CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-build:
    name: TypeScript, Lint & Build Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maktabit_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./maktabit-web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maktabit-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Build Next.js + Payload Production Bundle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maktabit_web
          PAYLOAD_SECRET: ci-build-secret-key-maktabit-technology-2026
          NEXT_PUBLIC_SITE_URL: http://localhost:3390
        run: npm run build
